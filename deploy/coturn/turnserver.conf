# Replace the realm and network ranges before starting coturn.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_A_RANDOM_SECRET_OF_AT_LEAST_32_BYTES
realm=turn.example.invalid
server-name=turn.example.invalid
no-multicast-peers
no-loopback-peers
stale-nonce=600
total-quota=32
user-quota=4
max-bps=50000000
log-file=stdout
simple-log
# Set these to the public address and private interface of your server.
# external-ip=PUBLIC_IP/PRIVATE_IP
# listening-ip=PRIVATE_IP
# relay-ip=PRIVATE_IP
# min-port=49160
# max-port=49200
